# Publishes nola-vscode to the VS Code Marketplace. Trigger by pushing a
# `vscode-v<version>` tag (must match packages/vscode/package.json — the
# extension's version is NOT lockstep) or manually via workflow_dispatch.
# Needs the VSCE_PAT secret: an Azure DevOps PAT with Marketplace > Manage
# scope for the `nola` publisher. Runs ONLY in the public repository
# (nola-lang/nola) — the private mirror source carries this file too but the
# job guard skips it. Manual runs package the VSIX (artifact) and publish only
# when dry-run is off.
name: publish-vscode

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "package the VSIX only, do not publish"
        type: boolean
        default: true

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nola-lang/nola'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Guard the manifest and extension tests
        run: npx vitest run test/publish-manifests.test.ts packages/vscode
      - name: Tag must match the extension version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          node -e '
            const { version } = require("./packages/vscode/package.json");
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `vscode-v${version}`) {
              console.error(`tag ${tag} does not match extension version ${version}`);
              process.exit(1);
            }'
      - name: Package VSIX
        run: npm run package -w nola-vscode
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/vscode/*.vsix
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v') || !inputs.dry-run
        run: npx vsce publish --packagePath packages/vscode/nola-vscode-*.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
